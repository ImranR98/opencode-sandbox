name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
      - 'renovate.json'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck build.sh entrypoint.sh profile-homebrew.sh profile-nvm.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: opencode-sandbox:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=opencode-sandbox
          cache-to: type=gha,mode=max,scope=opencode-sandbox

      - name: Verify image
        run: |
          set -euo pipefail
          expected_opencode="$(sed -n 's/^ARG OPENCODE_VERSION=//p' Dockerfile | head -1)"
          expected_node="$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile | head -1)"
          docker run --rm --entrypoint /usr/local/bin/docker-entrypoint.sh opencode-sandbox:ci /bin/bash -c '
            set -eu
            opencode --version | tee /tmp/opencode-version
            node --version | tee /tmp/node-version
            brew --version | head -1
          ' > /tmp/verify.log
          cat /tmp/verify.log
          grep -q "$expected_opencode" /tmp/verify.log
          grep -q "v${expected_node}" /tmp/verify.log
          echo "opencode ${expected_opencode} / node ${expected_node} verified"

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/imranr98/opencode-sandbox
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=opencode-sandbox
          cache-to: type=gha,mode=max,scope=opencode-sandbox

      - name: Verify pushed image
        run: |
          set -euo pipefail
          expected_opencode="$(sed -n 's/^ARG OPENCODE_VERSION=//p' Dockerfile | head -1)"
          expected_node="$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile | head -1)"
          docker run --rm --entrypoint /usr/local/bin/docker-entrypoint.sh "$IMAGE@${{ steps.build.outputs.digest }}" /bin/bash -c '
            set -eu
            opencode --version | tee /tmp/opencode-version
            node --version | tee /tmp/node-version
            brew --version | head -1
          ' > /tmp/verify.log
          cat /tmp/verify.log
          grep -q "$expected_opencode" /tmp/verify.log
          grep -q "v${expected_node}" /tmp/verify.log
          echo "opencode ${expected_opencode} / node ${expected_node} verified"

      - name: Promote verified image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:latest" | grep -q "Digest:.*${DIGEST#sha256:}"
          echo "promoted $DIGEST to $IMAGE:latest"
          echo "$DIGEST" > /tmp/digest
          cat /tmp/digest

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digest
          path: /tmp/digest
